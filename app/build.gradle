plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'org.woheller69.gptassist'
    android.buildFeatures.buildConfig true
    defaultConfig {
        applicationId "org.woheller69.gptassist"
        minSdk 21
        targetSdk 35
        versionCode 240
        versionName "2.40"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    lintOptions {
        disable "MissingTranslation" // Translation is crowd-sourced, so this lint warning is useless
    }
}

dependencies {
    // Keep Kotlin's merged 1.8+ standard library aligned with legacy transitive JDK artifacts.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.github.woheller69:FreeDroidWarn:+'
    testImplementation 'junit:junit:4.13.2'
}
